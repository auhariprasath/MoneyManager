# Application Name
spring.application.name=money-manager-backend

# Server Configuration  
server.port=${PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:MoneyManager}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
# Note: spring.mvc.cors.allowed-origins is often used, but here we keep the existing property name if the code uses it
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://hp-money.vercel.app}

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.moneymanager=INFO
